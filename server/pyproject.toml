[project]
name = "flea-market"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiofiles>=25.1.0",
  "aiogram>=3.0.0",
  "aiohttp>=3.13.2",
  "alembic>=1.16.5",
  "apscheduler",
  "asyncpg>=0.30.0",
  "bcrypt>=5.0.0",
  "fastapi>=0.116.1",
  "httpx[http2]>=0.28.1",
  "psycopg2-binary>=2.9.11",
  "py3xui>=0.5.4",
  "pydantic[email]>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.32",
  "pytoniq-core>=0.1.44",
  "pytz>=2025.2",
  "pyxui-async==1.0.2",
  "redis>=6.4.0",
  "celery[redis]>=5.4.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "structlog>=25.4.0",
  "taskipy>=1.14.1",
  "uvicorn>=0.35.0",
  "websockets>=15.0.1",
  "yookassa>=3.8.0",
  "pillow>=10.0.0",
  "loguru>=0.7.3",
  "cachetools>=7.2.0",
  "aiohappyeyeballs>=2.6.1",
  "aiosignal>=1.4.0",
  "annotated-types>=0.7.0",
  "attrs>=26.1.0",
  "certifi>=2026.4.22",
  "charset-normalizer>=3.4.7",
  "frozenlist>=1.8.0",
  "greenlet>=3.5.0",
  "idna>=3.15",
  "magic-filter>=1.0.12",
  "multidict>=6.7.1",
  "propcache>=0.5.2",
  "pydantic-core>=2.46.4",
  "python-dotenv>=1.2.2",
  "requests>=2.34.2",
  "typing-extensions>=4.15.0",
  "urllib3>=2.7.0",
  "yarl>=1.23.0",
  "openpyxl>=3.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "T20", "B039"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["F401"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "strict"

[tool.taskipy.tasks]
api = { cmd = "uvicorn src.app:app --reload --workers 1 --host localhost --port 8000", help = "run api service" }
bot = { cmd = "uv run -m src.bot.main", help = "run bot" }

worker = { cmd = "uv run celery -A src.workers.celery_app:celery_app worker --loglevel=info", help = "run worker" }
worker_beat = { cmd = "uv run celery -A src.workers.celery_app:celery_app beat --loglevel=info", help = "run worker" }

migrate_tg = { cmd = "uv run -m scripts.migrate_photos", help = "downloading photos" }

init_db = { cmd = "uv run -m scripts.init_db", help = "creating database" }
init_data = { cmd = "uv run -m scripts.get_init_data", help = "get telegram mini app init_data" }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
]
